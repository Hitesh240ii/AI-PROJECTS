services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333   # overrides the value in .env
    depends_on:
      - qdrant
    volumes:
      - ./data/uploads:/app/data/uploads

volumes:
  qdrant_data:
